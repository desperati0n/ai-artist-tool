    <script>
        window.lucide = {
            createIcons(root = document) {
                const map = {
                    'arrow-up-az': 'sort-ascending', 'check-circle': 'check-circle',
                    'chevron-down': 'caret-down', 'chevron-left': 'caret-left',
                    'chevron-right': 'caret-right', 'chevron-up': 'caret-up',
                    'clipboard-paste': 'clipboard-text', 'edit-2': 'pencil-simple',
                    'edit-3': 'pencil-simple', 'help-circle': 'question',
                    'layout-grid': 'grid-four', 'package-open': 'package',
                    'refresh-ccw': 'arrow-clockwise', 'shield-alert': 'warning',
                    'save': 'floppy-disk', 'trash-2': 'trash', 'wand-2': 'sliders-horizontal',
                    'zap': 'lightning', 'rocket': 'play', 'layers': 'stack'
                };
                (root || document).querySelectorAll('[data-lucide]').forEach((icon) => {
                    const source = icon.getAttribute('data-lucide');
                    icon.removeAttribute('data-lucide');
                    icon.classList.add('ph-bold', `ph-${map[source] || source}`);
                });
            }
        };
    </script>

        /* Pointer-origin fill adapted from the supplied OriginButton component. */
        .origin-button {
            --origin-x: 50%;
            --origin-y: 50%;
            --origin-size: 0px;
            --origin-fill: var(--nt-primary);
            --origin-active-text: var(--nt-primary-contrast);
            position: relative !important;
            overflow: hidden !important;
            isolation: isolate;
            touch-action: manipulation;
            transition: color .3s cubic-bezier(.16,1,.3,1), border-color .18s ease, background-color .18s ease, transform .12s ease !important;
        }
        .origin-button::before {
            content: "";
            position: absolute;
            z-index: 0;
            left: var(--origin-x);
            top: var(--origin-y);
            width: var(--origin-size);
            height: var(--origin-size);
            border-radius: 999px;
            background: var(--origin-fill);
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            transition: transform .5s cubic-bezier(.16,1,.3,1);
            will-change: transform;
        }
        .origin-button.is-origin-active::before { transform: translate(-50%, -50%) scale(1); }
        .origin-button__content {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: inherit;
            min-width: 0;
            color: inherit;
            line-height: 1;
            pointer-events: none;
        }
        .origin-button.is-origin-active:not(:disabled) { color: var(--origin-active-text) !important; }
        .origin-button.is-origin-active:not(:disabled) .origin-button__content,
        .origin-button.is-origin-active:not(:disabled) .origin-button__content * { color: inherit !important; }
        .origin-button[data-origin-pressed="true"] { transform: scale(.985) !important; }
        .origin-button:focus-visible {
            outline: 2px solid var(--nt-primary) !important;
            outline-offset: 2px;
        }
        .origin-button:disabled { pointer-events: none; opacity: .45; }
        .origin-button[class*="text-red"],
        .origin-button[class*="bg-red"] {
            --origin-fill: var(--nt-danger);
            --origin-active-text: #ffffff;
        }
        .dark .origin-button {
            --origin-fill: var(--nt-primary-active);
            --origin-active-text: var(--nt-primary-contrast);
        }
        .dark .origin-button[class*="text-red"],
        .dark .origin-button[class*="bg-red"] {
            --origin-fill: #e0524d;
            --origin-active-text: #ffffff;
        }

        /* Pointer-following spotlight, adapted from the supplied React GlowCard. */
        .spotlight-card {
            --spot-x: 50%;
            --spot-y: 50%;
            --spot-radius: 10rem;
            isolation: isolate;
        }
        .spotlight-card::before,
        .spotlight-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            transition: opacity .18s ease;
        }
        .spotlight-card::before {
            z-index: 31;
            padding: 2px;
            background: radial-gradient(
                var(--spot-radius) circle at var(--spot-x) var(--spot-y),
                var(--nt-spot-strong),
                var(--nt-spot-mid) 34%,
                transparent 72%
            );
            filter: drop-shadow(0 0 5px var(--nt-spot-shadow));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }
        .spotlight-card::after {
            z-index: 30;
            background: radial-gradient(
                calc(var(--spot-radius) * .88) circle at var(--spot-x) var(--spot-y),
                var(--nt-spot-wash),
                transparent 74%
            );
        }
        @media (hover: hover) and (pointer: fine) {
            .spotlight-card:hover::before,
            .spotlight-card:hover::after { opacity: 1; }

        #cat-list-scroll { padding: .75rem .6rem !important; }
        .sidebar-label { margin: 0 .4rem .4rem !important; color: var(--nt-faint) !important; font-size: .68rem !important; font-weight: 600 !important; letter-spacing: .03em !important; text-transform: none !important; }

        #sidebar-right-container > div:first-child { padding: .9rem 1rem !important; border-bottom: 1px solid var(--nt-line) !important; }

        #sidebar-right-container > .bg-slate-50 { background: var(--nt-canvas) !important; border-color: var(--nt-line) !important; }
        .format-switch { border: 1px solid var(--nt-line); border-radius: var(--nt-radius-md) !important; background: var(--nt-surface) !important; }
        .format-switch .capsule-bg { border-radius: 6px !important; background: var(--nt-primary) !important; box-shadow: none !important; }

        #right-artist-list-scroll { padding: .75rem !important; background: var(--nt-surface); }
        .artist-drag-item,
        .dark .artist-drag-item {

            border-bottom-color: var(--nt-line) !important;

        .artist-drag-item .text-slate-700,

        .artist-drag-item .text-slate-400 { color: var(--nt-secondary) !important; }
        .artist-drag-item .bg-white,
        .dark .artist-drag-item .dark\:bg-slate-800 { background: var(--nt-surface) !important; border-color: var(--nt-line) !important; }

        #sidebar-right-container > div:last-child { padding: .75rem !important; border-top: 1px solid var(--nt-line) !important; background: var(--nt-canvas) !important; backdrop-filter: none !important; }
        #res-box {

        #res-box:focus { border-color: var(--nt-primary) !important; }
        #res-box + div { display: grid !important; grid-template-columns: 1fr 1fr 1.35fr 40px; gap: .4rem !important; }
        #res-box + div button { display: inline-flex !important; align-items: center !important; justify-content: center !important; min-height: 36px; border: 1px solid var(--nt-line) !important; border-radius: var(--nt-radius-md) !important; background: var(--nt-surface) !important; color: var(--nt-ink) !important; box-shadow: none !important; line-height: 1 !important; }

        #modal-container .fixed.inset-0 > .absolute { background: rgba(0,0,0,.42) !important; backdrop-filter: none !important; }
        #modal-container .fixed.inset-0 > div:last-child { border: 1px solid var(--nt-line); border-radius: var(--nt-radius-lg) !important; background: var(--nt-surface) !important; color: var(--nt-ink); box-shadow: 0 12px 32px rgba(0,0,0,.08) !important; }
        #modal-container input,
        #modal-container textarea,
        #modal-container select { border: 1px solid #dddddd !important; border-radius: var(--nt-radius-sm) !important; background: var(--nt-surface) !important; color: var(--nt-ink) !important; }
        #modal-container .bg-gradient-to-r { background-image: none !important; background-color: var(--nt-primary) !important; }
        #modal-container button[class*="bg-indigo-600"],
        #modal-container button[class*="bg-green-500"],
        #modal-container button[class*="bg-blue-600"] { background: var(--nt-primary) !important; border-color: var(--nt-primary) !important; box-shadow: none !important; }
        #modal-container button[class*="bg-indigo-600"],
        #modal-container button[class*="bg-green-500"],
        #modal-container button[class*="bg-blue-600"] { color: var(--nt-primary-contrast) !important; }
        #modal-container button { box-shadow: none !important; }
        [class~="text-indigo-600"],
        [class~="text-indigo-500"],
        [class~="dark:text-indigo-400"] { color: var(--nt-primary) !important; }
        [class~="bg-indigo-100"],
        [class~="bg-indigo-50"] { background-color: var(--nt-blue-soft) !important; }
        [class~="bg-indigo-600"],
        [class~="bg-indigo-500"] { background-color: var(--nt-primary) !important; color: var(--nt-primary-contrast) !important; }
        [class~="border-indigo-600"] { border-color: var(--nt-primary) !important; }
        input[class*="accent-indigo"] { accent-color: var(--nt-primary); }
        #toast-container > div { border-radius: var(--nt-radius-md) !important; background: var(--nt-ink) !important; color: var(--nt-surface) !important; box-shadow: 0 4px 18px rgba(0,0,0,.08) !important; }

        .panel-scrim { display: none; }
        .panel-close { display: none; }

        @media (max-width: 1180px) {
            .layout-container { grid-template-columns: 13rem minmax(0, 1fr); }
            .sidebar-right {
                display: flex;
                position: fixed;
                inset: 0 0 0 auto;
                z-index: 80;
                width: min(22rem, 92vw);
                transform: translateX(101%);
                border-left: 1px solid var(--nt-line);
                transition: transform .2s ease;
            }
            .sidebar-right.is-open { transform: translateX(0); }
            .composer-toggle,
            .sidebar-right .panel-close { display: inline-flex; }
            .panel-close { align-items: center; justify-content: center; width: 36px; min-height: 36px; border-radius: var(--nt-radius-md); color: var(--nt-secondary); }
            .panel-scrim { position: fixed; inset: 0; z-index: 70; border: 0; border-radius: 0; background: rgba(0,0,0,.32); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
            .panel-scrim.is-open { display: block; opacity: 1; pointer-events: auto; }
        }
        @media (max-width: 768px) {
            .layout-container { display: block; }
            .sidebar-left {
                display: flex;
                position: fixed;
                inset: 0 auto 0 0;
                z-index: 80;
                width: min(19rem, 88vw);
                transform: translateX(-101%);
                border-right: 1px solid var(--nt-line);
                transition: transform .2s ease;
            }
            .sidebar-left.is-open { transform: translateX(0); }
            .filter-toggle,
            .sidebar-left .panel-close { display: inline-flex; }
            #main-header { height: auto !important; min-height: 6.75rem; padding-block: .65rem !important; }
            .tool-header { grid-template-columns: 1fr auto; gap: .5rem; }
            .tool-search { grid-column: 1 / -1; grid-row: 2; }
            .tool-status { display: none; }
            .tool-actions { grid-column: 2; grid-row: 1; }
            .tool-actions .utility-button,
            .tool-actions .primary-button { width: 36px; padding: 0; }
            .tool-actions button:not(.origin-button) > span,
            .tool-actions button.origin-button > .origin-button__content > span { display: none; }
            #grid-container { padding: .75rem !important; }
            #grid-container > .grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: .6rem !important; }
        }
        @media (max-width: 480px) {
            #grid-container > .grid { grid-template-columns: 1fr !important; }
        }

        /* Final contrast guard: component-specific button colors must not beat the animated fill state. */
        #app button.origin-button.is-origin-active:not(:disabled),
        #app button.origin-button.is-origin-active:not(:disabled) .origin-button__content,
        #app button.origin-button.is-origin-active:not(:disabled) .origin-button__content *,
        #modal-container button.origin-button.is-origin-active:not(:disabled),
        #modal-container button.origin-button.is-origin-active:not(:disabled) .origin-button__content,
        #modal-container button.origin-button.is-origin-active:not(:disabled) .origin-button__content * {
            color: var(--origin-active-text) !important;
            -webkit-text-fill-color: var(--origin-active-text) !important;
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>

    <div id="app"></div>
    <div id="modal-container"></div>
    <div id="toast-container" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>
    <div id="artist-preview-tooltip"></div>

    <script>
        // =========================================
        // 1. 数据库与存储
        // =========================================
        const DB_NAME = 'NAIArtistDB_V12'; // 升级版本
        const STORE_NAME = 'images';
        const METADATA_KEY = 'nai-v12-meta';
        const CATEGORY_KEY = 'nai-v12-cats';
        const PRESET_KEY = 'nai-v12-presets';
        const THEME_KEY = 'nai-v12-theme';

        const db = {
            conn: null,
            async open() {
                if (this.conn) return this.conn;
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, 1);
                    req.onerror = () => reject('DB Error');
                    req.onsuccess = (e) => { this.conn = e.target.result; resolve(this.conn); };
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
                    };
                });
            },
            async put(id, data) {
                try {
                    const conn = await this.open();
                    return new Promise((r) => { const tx = conn.transaction(STORE_NAME, 'readwrite'); tx.objectStore(STORE_NAME).put(data, String(id)); tx.oncomplete = r; tx.onerror=()=>r(); });
                } catch(e){}
            },
            async get(id) {
                try {
                    const conn = await this.open();
                    return new Promise((r) => { const tx = conn.transaction(STORE_NAME, 'readonly'); const req = tx.objectStore(STORE_NAME).get(String(id)); req.onsuccess = () => r(req.result); req.onerror = () => r(null); });
                } catch(e) { return null; }
            },
            async delete(id) {
                try {
                    const conn = await this.open();
                    return new Promise((r) => { const tx = conn.transaction(STORE_NAME, 'readwrite'); tx.objectStore(STORE_NAME).delete(String(id)); tx.oncomplete = r; });
                } catch(e){}
            }
        };

        const compressImage = (file) => new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_W = 400;
                    let w = img.width, h = img.height;
                    if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.85));
                };
            };
        });

        // =========================================
        // 2. 状态管理
        // =========================================
        let state = {
            artists: [],
            categories: [],
            presets: [],
            viewMode: 'artists', 
            searchQuery: '',
            currentCategory: '全部',
            sortMode: 'default',
            page: 1,
            pageSize: 24,
            selected: {}, 
            selectedOrder: [], // explicit order for selected artists
            batchMode: false,
            batchSelected: {}, 
            promptFormat: 'novelai',
            pageImages: {}, 
            modal: null, 
            editingId: null,
            formData: {},
            theme: 'light'
        };

        const actions = {
            init: async () => {
                state.theme = localStorage.getItem(THEME_KEY) || 'light';
                const savedCats = localStorage.getItem(CATEGORY_KEY);
                state.categories = savedCats ? JSON.parse(savedCats) : ["二次元", "厚涂", "写实", "水墨", "黑白", "R18"];
                const savedPresets = localStorage.getItem(PRESET_KEY);
                state.presets = savedPresets ? JSON.parse(savedPresets) : [];
                const savedMeta = localStorage.getItem(METADATA_KEY);
                if(savedMeta) {
                    try {
                        const parsed = JSON.parse(savedMeta);
                        state.artists = parsed.map(a => ({
                            ...a, id: String(a.id), name: a.name||a.tag||'Unknown', tag: a.tag||a.name||'',
                            categories: Array.isArray(a.categories) ? a.categories : [a.category || '未分类'],
                            socialLinks: Array.isArray(a.socialLinks) ? a.socialLinks : []
                        }));
                    } catch(e) { state.artists = []; }
                }
                renderAppStructure();
                updateTheme();
                renderAll();
            },
            
            saveMeta: () => localStorage.setItem(METADATA_KEY, JSON.stringify(state.artists.map(({imageUrl, ...r})=>r))),
            saveCats: () => localStorage.setItem(CATEGORY_KEY, JSON.stringify(state.categories)),
            savePresets: () => localStorage.setItem(PRESET_KEY, JSON.stringify(state.presets)),
            setTheme: (t) => { state.theme = t; localStorage.setItem(THEME_KEY, t); updateTheme(); },

            setViewMode: (mode) => {
                state.viewMode = mode;
                state.page = 1;
                state.batchMode = false;
                state.batchSelected = {};
                renderSidebarLeft();
                renderGrid();
                renderMainHeader();
            },

            selectCategory: (category) => {
                if (state.currentCategory === category) return;

                state.currentCategory = category;
                state.page = 1;
                renderGrid();
                renderMainHeader();

                const list = document.querySelector('.category-list');
                if (!list) return;

                list.querySelectorAll('.category-item').forEach((item) => {
                    const itemCategory = decodeURIComponent(item.dataset.category || '');
                    const isActive = itemCategory === category;
                    item.classList.toggle('is-active', isActive);
                    item.querySelector(':scope > button:first-child')?.setAttribute('aria-current', isActive ? 'true' : 'false');
                });
                syncCategoryDockPill(true);
            },

            handleSearch: (val) => { state.searchQuery = val; state.page = 1; renderGrid(); },

            toggleCardClick: (id) => {
                id = String(id);
                if (state.batchMode) {
                    const newBatch = {...state.batchSelected};
                    if(newBatch[id]) delete newBatch[id]; else newBatch[id] = true;
                    state.batchSelected = newBatch;
                    updateCardVisual(id);
                    renderBatchBar();
                } else {
                    if (state.viewMode === 'presets') {
                        const p = state.presets.find(x => x.id === id);
                        if(p && p.items) {
                            p.items.forEach(item => {
                                state.selected[item.id] = item.weight || 1.0;
                                if (!state.selectedOrder.includes(item.id)) state.selectedOrder.push(item.id);
                            });
                            renderSidebarRight();
                            showToast(`已加载预设: ${p.name}`);
                        }
                    } else {
                        const newSel = {...state.selected};
                        if(newSel[id]) {
                            delete newSel[id];
                            state.selectedOrder = state.selectedOrder.filter(x => x !== id);
                        } else {
                            newSel[id] = 1.0;
                            state.selectedOrder.push(id);
                        }
                        state.selected = newSel;
                        updateCardVisual(id);
                        renderSidebarRight();
                    }
                }
            },

            toggleBatchMode: () => { state.batchMode = !state.batchMode; state.batchSelected = {}; renderMainHeader(); renderGrid(); },
            
            batchSelectAll: () => {
                const list = getFilteredList(); 
                const newBatch = {...state.batchSelected};
                const allSelected = list.every(a => newBatch[a.id]);
                list.forEach(a => { if(allSelected) delete newBatch[a.id]; else newBatch[a.id] = true; });
                state.batchSelected = newBatch;
                renderGrid(); renderBatchBar();
            },

            // --- 修复 2: 批量删除逻辑 (确保全局删除) ---
            batchDelete: async () => {
                const ids = Object.keys(state.batchSelected);
                if(ids.length === 0) return;
                
                if(!confirm(`确定要永久删除选中的 ${ids.length} 位画师吗？此操作将从所有分类中移除。`)) return;
                
                for(const id of ids) await db.delete(id);
                
                // 全局删除：直接过滤掉 ID 在选中列表里的画师
                state.artists = state.artists.filter(a => !state.batchSelected[String(a.id)]);
                
                // 清理选中态
                const newSel = {...state.selected};
                ids.forEach(id => delete newSel[id]);
                state.selected = newSel;
                
                state.batchSelected = {};
                state.batchMode = false;
                
                actions.saveMeta();
                renderAll(); // 刷新所有视图
                showToast("批量删除成功");
            },

            // 新增：仅从当前分类移除 (不删除数据)
            batchRemoveFromCategory: () => {
                const cat = state.currentCategory;
                if(cat === '全部' || cat === '未分类') return showToast("请使用批量删除功能");
                
                const ids = Object.keys(state.batchSelected);
                if(ids.length === 0) return;

                if(!confirm(`确定将选中的 ${ids.length} 位画师移出 "${cat}" 分类吗？`)) return;

                state.artists = state.artists.map(a => {
                    if(state.batchSelected[String(a.id)]) {
                        // 移除当前分类
                        const newCats = a.categories.filter(c => c !== cat);
                        // 如果没有分类了，归为未分类
                        if(newCats.length === 0) newCats.push('未分类');
                        return { ...a, categories: newCats };
                    }
                    return a;
                });

                state.batchSelected = {};
                state.batchMode = false;
                actions.saveMeta();
                renderAll();
                showToast("已移出分类");
            },

            openBatchCategoryModal: () => {
                if(Object.keys(state.batchSelected).length === 0) return showToast("请先选择画师");
                state.modal = 'batch-cat';
                renderModal();
            },
            
            batchAddCategories: (cats) => {
                state.artists = state.artists.map(a => {
                    if(state.batchSelected[String(a.id)]) {
                        const newCats = [...new Set([...a.categories, ...cats])];
                        return { ...a, categories: newCats };
                    }
                    return a;
                });
                actions.saveMeta();
                state.modal = null;
                state.batchMode = false;
                state.batchSelected = {};
                renderModal(); renderAll();
                showToast(`分类已更新`);
            },

            // --- 修复 1: 补全删除单个画师函数 ---
            deleteArtist: async (id) => {
                id = String(id);
                if(!confirm("确定要删除这位画师吗？")) return;
                
                try { await db.delete(id); } catch(e) { console.warn('DB delete error:', e); }
                state.artists = state.artists.filter(a => String(a.id) !== id);
                
                // 清理所有选中状态
                delete state.selected[id];
                delete state.batchSelected[id];
                delete state.pageImages[id];
                
                // 隐藏可能存在的预览提示
                hideArtistPreview();
                _hoveredPieIdx = -1;
                
                actions.saveMeta();

        // =========================================
        // 画师串解析 (Parse Prompt Input)
        // =========================================

        // Strip "artist:" prefix that NAI allows as a tag qualifier
        // e.g. "artist:pikazo_mika" → "pikazo_mika"
        const stripArtistPrefix = (raw) => raw.trim().replace(/^artist:\s*/i, '').trim();

        const parsePromptInput = (text) => {
            text = text.trim();
            if (!text) return [];
            const results = []; // { tag, weight }

            // NAI format uses '::' as delimiter.
            // Valid forms per spec:
            //   weight::artist1, artist2::   - weighted group
            //   artist1, artist2             - bare comma-separated (weight = 1.0)
            //   Mixed: 0.8::artistA::, artistB, 1.2::artistD, artistE::
            // Weight MUST be a proper decimal number (≥1 digit before or after dot).
            // This prevents artist names containing digits from being mis-parsed as weights.

            const hasNaiSyntax = text.includes('::');

            if (hasNaiSyntax) {
                // Strict weight pattern: requires at least one digit group.
                // Matches:  0.8::content::   1::content::   1.0::content::
                // Does NOT match: ::content:: (no leading digits → treated as bare text)
                // Does NOT match: 1girl::content:: (1girl has letters, regex can't consume past digit)
                const naiGroupRegex = /(\d+(?:\.\d+)?)\s*::\s*((?:[^:]|:(?!:))+?)\s*::/g;
                const groupMatches = [];
                let match;

                while ((match = naiGroupRegex.exec(text)) !== null) {
                    groupMatches.push({
                        weight: parseFloat(match[1]),
                        content: match[2],
                        start: match.index,
                        end: match.index + match[0].length
                    });
                }

                // Walk through text, collecting bare segments between weighted groups
                let cursor = 0;
                for (const gm of groupMatches) {
                    if (gm.start > cursor) {
                        // Bare text before this weighted group
                        const bareText = text.slice(cursor, gm.start).trim().replace(/^[,\s]+|[,\s]+$/g, '');
                        if (bareText) {
                            bareText.split(',').forEach(t => {
                                const tag = stripArtistPrefix(t);
                                if (tag) results.push({ tag, weight: 1.0 });
                            });
                        }
                    }
                    // Weighted group
                    const weight = (isNaN(gm.weight) || gm.weight <= 0) ? 1.0 : Math.round(gm.weight * 10) / 10;
                    gm.content.split(',').forEach(t => {
                        const tag = stripArtistPrefix(t);
                        if (tag) results.push({ tag, weight });
                    });
                    cursor = gm.end;
                }
                // Trailing bare text after last weighted group
                if (cursor < text.length) {
                    const bareText = text.slice(cursor).trim().replace(/^[,\s]+|[,\s]+$/g, '');
                    if (bareText) {
                        bareText.split(',').forEach(t => {
                            const tag = stripArtistPrefix(t);
                            if (tag) results.push({ tag, weight: 1.0 });
                        });
                    }
                }
            } else {
                // No '::' → try WebUI format or plain comma list
                text.split(',').forEach(token => {
                    token = token.trim();
                    if (!token) return;
                    // WebUI weighted: (tag:1.1)
                    const webuiMatch = token.match(/^\(\s*(.+?)\s*:\s*([\d.]+)\s*\)$/);
                    if (webuiMatch) {
                        const tag = stripArtistPrefix(webuiMatch[1]);
                        let w = parseFloat(webuiMatch[2]);
                        if (isNaN(w) || w <= 0) w = 1.0;
                        if (tag) results.push({ tag, weight: Math.round(w * 10) / 10 });
                    } else {
                        const tag = stripArtistPrefix(token.replace(/^\(+|\)+$/g, ''));
                        if (tag) results.push({ tag, weight: 1.0 });
                    }
                });
            }

            return results;
        };

        const importFromPromptText = (text) => {
            const parsed = parsePromptInput(text);
            if (parsed.length === 0) return showToast('未检测到有效的画师标签');

            // Clear current selection and ghost entries
            state.selected = {};
            state.selectedOrder = [];
            state.artists = state.artists.filter(a => !a._ghost);

            let foundCount = 0;
            let ghostCount = 0;

            for (const item of parsed) {
                const needle = item.tag.toLowerCase().trim();

                // Multi-strategy lookup (case-insensitive):
                // 1. Exact match on tag or name
                // 2. DB tag has 'artist:' prefix but input doesn't (or vice versa)
                const findArtist = (q) => state.artists.find(a => {
                    const dbTag  = (a.tag  || '').toLowerCase().trim();
                    const dbName = (a.name || '').toLowerCase().trim();
                    // Strip 'artist:' from DB tag for comparison
                    const dbTagStripped = dbTag.replace(/^artist:\s*/, '');
                    return dbTag === q || dbName === q || dbTagStripped === q;
                });

                let artist = findArtist(needle);
                // Also try with 'artist:' prefix prepended (in case DB stores "artist:xxx")
                if (!artist) artist = findArtist('artist:' + needle);

                if (artist) {
                    const id = String(artist.id);
                    if (!(id in state.selected)) {
                        state.selected[id] = item.weight;
                        state.selectedOrder.push(id);
                        foundCount++;
                    }

            }

            renderGrid();

            showToast(msg);

        const renderAll = () => { renderSidebarLeft(); renderMainHeader(); renderGrid(); renderSidebarRight(); };

        // =========================================
        // 7. Danbooru Data Fetcher (Browser-side)
        // =========================================
        const danbooruFetcher = (() => {
            const API = 'https://danbooru.donmai.us';
            const MAX_RETRIES = 2;
            const RETRY_DELAY = 3000;
            let _cancelled = false, _running = false, _abort = null;

            class RateLimiter {
                constructor(r) { this.rate = r; this.tokens = r; this.last = performance.now(); }
                async acquire() {
                    while (true) {
                        const now = performance.now();
                        this.tokens = Math.min(this.rate, this.tokens + (now - this.last) / 1000 * this.rate);
                        this.last = now;
                        if (this.tokens >= 1) { this.tokens--; return; }
                        await new Promise(r => setTimeout(r, 60));
                    }
                }
            }
            let limiter = new RateLimiter(3);

            const normalize = (tag) => tag.trim().replace(/^,?\s*a?rt?ist:\s*/i, '').replace(/ /g, '_').toLowerCase().replace(/_+/g, '_').replace(/^_|_$/g, '');

            const _fetch = async (url, signal) => {
                await limiter.acquire();
                const r = await fetch(url, { headers: { Accept: 'application/json' }, signal });
                if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
                return r.json();
            };

            const _req = async (url, signal) => {
                for (let i = 0; i < MAX_RETRIES; i++) {
                    try { return [await _fetch(url, signal), null]; }
                    catch (e) {
                        if (e.name === 'AbortError') return [null, 'cancelled'];
                        if (e.status === 429) { await new Promise(r => setTimeout(r, RETRY_DELAY * (i + 2))); continue; }
                        if (i < MAX_RETRIES - 1) await new Promise(r => setTimeout(r, RETRY_DELAY));
                        else return [null, e.message || 'error'];
                    }
                }
                return [null, 'max_retries'];
            };

            const getCount = async (tag, signal) => {
                const n = normalize(tag);
                if (!n) return [0, null, 'empty'];
                let [d, e] = await _req(API + '/tags.json?search[name]=' + encodeURIComponent(n) + '&search[category]=1&limit=1', signal);
                if (e) return [0, null, 'error:' + e];
                if (d && d.length > 0) return [d[0].post_count, d[0].name, 'artist'];
                [d, e] = await _req(API + '/tags.json?search[name]=' + encodeURIComponent(n) + '&limit=1', signal);
                if (e) return [0, null, 'error:' + e];
                if (d && d.length > 0) return [d[0].post_count, d[0].name, 'any'];
                return [0, null, 'not_found'];
            };

            const getUrls = async (tag, signal) => {
                const n = normalize(tag);
                if (!n) return [[], null];
                let [ad, e1] = await _req(API + '/artists.json?search[name]=' + encodeURIComponent(n) + '&limit=1', signal);
                if (e1) return [null, e1];
                if (!ad || !ad.length || !ad[0] || !ad[0].id) return [[], null];
                let [ud, e2] = await _req(API + '/artist_urls.json?search[artist_id]=' + ad[0].id, signal);
                if (e2) return [null, e2];
                if (!ud) return [[], null];
                const seen = new Set(), out = [];
                for (const it of ud) {
                    const u = typeof it === 'string' ? it : (it && it.is_active !== false ? it.url : null);
                    if (u) { const k = u.trim().replace(/\/+$/, ''); if (!seen.has(k)) { seen.add(k); out.push(u.trim()); } }
                }
                return [out, null];
            };

            const pool = async (limit, items, fn) => {
                const exec = new Set();
                for (let i = 0; i < items.length; i++) {
                    if (_cancelled) break;
                    const p = fn(items[i], i).finally(() => exec.delete(p));
                    exec.add(p);
                    if (exec.size >= limit) await Promise.race(exec);
                }
                if (exec.size > 0) await Promise.allSettled([...exec]);
            };

            const start = async (opts) => {
                if (_running) return;
                _running = true; _cancelled = false;
                _abort = new AbortController();
                const o = opts || {};
                const force = !!o.force, skipUrls = !!o.skipUrls, urlsOnly = !!o.urlsOnly;
                const rate = o.rateLimit || 3, conc = o.concurrency || 3;
                const onProg = o.onProgress || function(){}, onLog = o.onLog || function(){}, onDone = o.onComplete || function(){};
                limiter = new RateLimiter(rate);
                const sig = _abort.signal, arts = state.artists, todo = [];

                if (force) {
                    for (let i = 0; i < arts.length; i++) todo.push({ i: i, a: arts[i], m: 'full' });
                    onLog('\u5f3a\u5236\u6a21\u5f0f\uff1a\u5168\u90e8 ' + arts.length + ' \u4f4d\u753b\u5e08');
                } else if (urlsOnly) {
                    for (let i = 0; i < arts.length; i++) if ((arts[i].danbooruCount||0)>0 && (!arts[i].socialLinks||!arts[i].socialLinks.length)) todo.push({ i: i, a: arts[i], m: 'urls' });
                    onLog('\u8865\u6293\u94fe\u63a5\uff1a' + todo.length + ' \u4f4d');
                } else {
                    for (let i = 0; i < arts.length; i++) {
                        if (!(arts[i].danbooruCount > 0)) todo.push({ i: i, a: arts[i], m: 'full' });
                        else if (!skipUrls && (!arts[i].socialLinks||!arts[i].socialLinks.length)) todo.push({ i: i, a: arts[i], m: 'urls' });
                    }
                    onLog('\u9700\u66f4\u65b0: ' + todo.length + ' / ' + arts.length);
                }
                if (!todo.length) { onLog('\u2705 \u6240\u6709\u6570\u636e\u5df2\u662f\u6700\u65b0'); onDone({ done:0, found:0, notFound:0, error:0, total:0 }); _running = false; return; }
                const s = { done:0, found:0, notFound:0, error:0, total:todo.length, t0:performance.now() };
                onLog('\u5f00\u59cb (\u5e76\u53d1=' + conc + ', \u901f\u7387=' + rate + '/s)');
                let saveN = 0;
                await pool(conc, todo, async (item) => {
                    if (_cancelled) return;
                    const tag = item.a.tag || '';
                    if (!tag.trim()) { s.done++; onProg(s, ''); return; }
                    try {
                        if (item.m === 'urls') {
                            const [urls, err] = await getUrls(tag, sig);
                            if (!err && urls) { state.artists[item.i].socialLinks = urls; urls.length ? s.found++ : s.notFound++; } else s.error++;
                        } else {
                            const [cnt,,mth] = await getCount(tag, sig);
                            if (cnt > 0) {
                                state.artists[item.i].danbooruCount = cnt; s.found++;
                                if (!skipUrls) { const [urls, err] = await getUrls(tag, sig); if (!err && urls) state.artists[item.i].socialLinks = urls; }
                            } else if (mth && mth.indexOf('error') >= 0) s.error++;
                            else s.notFound++;
                        }
                    } catch(e) { if (e.name !== 'AbortError') s.error++; }
                    s.done++; saveN++;
                    onProg(s, tag);
                    if (saveN % 20 === 0) { actions.saveMeta(); onLog('\ud83d\udcbe \u5df2\u4fdd\u5b58 (' + s.done + '/' + s.total + ')'); }
                });
                actions.saveMeta(); _running = false;
                if (_cancelled) onLog('\u26a0\ufe0f \u5df2\u53d6\u6d88 (' + s.done + '/' + s.total + ')\uff0c\u6570\u636e\u5df2\u4fdd\u5b58');
                else onLog('\u2705 \u5b8c\u6210! \u5339\u914d:' + s.found + ' \u672a\u627e\u5230:' + s.notFound + ' \u9519\u8bef:' + s.error);
                onDone(s);
            };

            return {
                normalize, getCount, getUrls, start,

            const addLog = (msg) => { const t = new Date().toLocaleTimeString('zh-CN',{hour12:false}); logs.innerHTML += '<div>['+t+'] '+msg+'</div>'; logs.scrollTop = logs.scrollHeight; };
            const updProg = (s, tag) => {
                const pct = s.total ? s.done/s.total*100 : 0, el = (id) => document.getElementById(id);
                const sec = (performance.now()-s.t0)/1000, spd = sec>0?s.done/sec:0, eta = spd>0?(s.total-s.done)/spd:0;
                const etaS = eta<60?Math.round(eta)+'s':Math.floor(eta/60)+'m'+Math.round(eta%60)+'s';
                const f=el('db-progress-fill'); if(f) f.style.width=pct.toFixed(1)+'%';

                const c=el('db-current'); if(c) c.textContent=tag||'';
            };

                            </div>

                                    ${(a.socialLinks && a.socialLinks.length > 0) ? `<div class="flex gap-1 ml-auto overflow-x-auto scrollbar-hide flex-nowrap items-center" style="max-width: 60%; padding-right: 12px;">${a.socialLinks.map(u => `<a href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="social-link-icon flex-shrink-0" title="${u}">${getSocialIcon(u)}</a>`).join('')}</div>` : ''}
                                </div>

                        </div>`;

                    }).join('')}</div>`;
                    injectImages(pageItems);
                }
                footer.innerHTML = `<span class="text-slate-500">Total: ${list.length} Artists</span><div class="flex items-center gap-2"><button onclick="actions.setPage(${state.page-1})" ${state.page===1?'disabled':''} class="p-1.5 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg disabled:opacity-30"><i data-lucide="chevron-left" class="w-5 h-5 dark:text-white"></i></button><span class="font-mono font-bold dark:text-white w-10 text-center text-base">${state.page}</span><button onclick="actions.setPage(${state.page+1})" ${state.page===totalPage?'disabled':''} class="p-1.5 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg disabled:opacity-30"><i data-lucide="chevron-right" class="w-5 h-5 dark:text-white"></i></button></div>`;
            }
            // Restore scroll position synchronously to avoid flash
            container.scrollTop = savedGridScrollTop;

        };

        const updateCardVisual = (id) => {
            const card = document.getElementById(`card-${id}`);

        const injectImages = async (items) => {
            const idsNeeded = items.filter(a => !state.pageImages[a.id]).map(a => a.id);

                if(el && cache) { el.src=cache; el.classList.remove('opacity-0'); }

                for(const id of idsNeeded) {

                    }
                }
            }
        };

        // =========================================
        // 饼状图 & 悬停预览
        // =========================================
        const PIE_COLORS = ['#252522','#6b655d','#a89f93','#4d5b57','#596554','#7a6548','#3c3a37','#c1b7a7'];
        let _pieSegments = [];
        let _hoveredPieIdx = -1;

        const drawPieChart = (canvasId, items) => {
            const canvas = document.getElementById(canvasId);
            if (!canvas || items.length === 0) return;
            const dpr = window.devicePixelRatio || 1;
            const displayW = canvas.clientWidth;
            const displayH = canvas.clientHeight;
            canvas.width = displayW * dpr;
            canvas.height = displayH * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            const cx = displayW / 2, cy = displayH / 2;
            const outerR = Math.min(cx, cy) - 12;
            const innerR = outerR * 0.52;
            const totalWeight = items.reduce((s, a) => s + (state.selected[String(a.id)] || 1), 0);
            let startAngle = -Math.PI / 2;
            _pieSegments = [];
            items.forEach((a, i) => {
                const weight = state.selected[String(a.id)] || 1;
                const slice = (weight / totalWeight) * Math.PI * 2;
                const endAngle = startAngle + slice;
                const hovered = _hoveredPieIdx === i;
                const r = hovered ? outerR + 5 : outerR;
                const ir = hovered ? innerR - 2 : innerR;
                ctx.beginPath();
                ctx.arc(cx, cy, r, startAngle, endAngle);
                ctx.arc(cx, cy, ir, endAngle, startAngle, true);
                ctx.closePath();
                const color = PIE_COLORS[i % PIE_COLORS.length];
                ctx.fillStyle = color;
                if (hovered) { ctx.shadowColor = color; ctx.shadowBlur = 14; }
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();
                const pct = ((weight / totalWeight) * 100);
                if (slice > 0.35) {
                    const mid = startAngle + slice / 2;
                    const lr = (r + ir) / 2;
                    ctx.fillStyle = '#fff';
                    ctx.font = "600 11px 'Segoe UI Variable', sans-serif";
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(Math.round(pct) + '%', cx + Math.cos(mid) * lr, cy + Math.sin(mid) * lr);
                }
                _pieSegments.push({ startAngle, endAngle, artist: a, index: i, color, pct: pct.toFixed(1) });
                startAngle = endAngle;
            });
            ctx.fillStyle = state.theme === 'dark' ? '#e2e8f0' : '#334155';
            ctx.font = "700 22px 'Segoe UI Variable', sans-serif";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(items.length, cx, cy - 8);
            ctx.font = "11px 'Segoe UI Variable', sans-serif";
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('位画师', cx, cy + 12);
        };

        const setupPieHover = (canvasId, items) => {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const displayW = canvas.clientWidth, displayH = canvas.clientHeight;
            const cx = displayW / 2, cy = displayH / 2;
            const outerR = Math.min(cx, cy) - 12;
            const innerR = outerR * 0.52;
            const totalWeight = items.reduce((s, a) => s + (state.selected[String(a.id)] || 1), 0);
            canvas.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left, my = e.clientY - rect.top;
                const dx = mx - cx, dy = my - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                let found = -1;
                if (dist >= innerR - 4 && dist <= outerR + 8) {
                    let mouseAngle = Math.atan2(dy, dx) + Math.PI / 2;
                    if (mouseAngle < 0) mouseAngle += Math.PI * 2;
                    let cum = 0;
                    for (let i = 0; i < items.length; i++) {
                        const w = state.selected[String(items[i].id)] || 1;
                        const slice = (w / totalWeight) * Math.PI * 2;
                        if (mouseAngle >= cum && mouseAngle < cum + slice) { found = i; break; }
                        cum += slice;
                    }
                }
                if (found !== _hoveredPieIdx) {
                    _hoveredPieIdx = found;
                    drawPieChart(canvasId, items);
                    if (found >= 0) {
                        showArtistPreview(String(items[found].id), e);
                        highlightArtistRow(found);
                    } else { hideArtistPreview(); highlightArtistRow(-1); }
                } else if (found >= 0) { movePreviewTooltip(e); }
            };
            canvas.onmouseleave = () => {
                if (_hoveredPieIdx !== -1) { _hoveredPieIdx = -1; drawPieChart(canvasId, items); hideArtistPreview(); highlightArtistRow(-1); }
            };
        };

        const highlightArtistRow = (idx) => {
            document.querySelectorAll('.artist-hover-row').forEach((el, i) => {

        };

        const showArtistPreview = async (id, evt) => {
            const tooltip = document.getElementById('artist-preview-tooltip');
            if (!tooltip) return;
            let img = state.pageImages[id];
            if (!img) { img = await db.get(id); if (img) state.pageImages[id] = img; }
            const artist = state.artists.find(a => String(a.id) === id);
            const name = artist ? artist.name : 'Unknown';
            const selIds = Object.keys(state.selected);
            const tw = selIds.reduce((s, sid) => s + (state.selected[sid] || 1), 0);

            if (img) {
                tooltip.innerHTML = `<img src="${img}"><div class="preview-label">${name}<span class="preview-pct">${pct}%</span></div>`;

                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';

                    const midY = rect.top + rect.height / 2;
                    rows.forEach(r => { r.classList.remove('drag-over-top', 'drag-over-bottom'); });
                    if (e.clientY < midY) {
                        row.classList.add('drag-over-top');
                    } else {
                        row.classList.add('drag-over-bottom');

                row.addEventListener('dragleave', () => {
                    row.classList.remove('drag-over-top', 'drag-over-bottom');

                row.addEventListener('drop', (e) => {

                    const fromIdx = _dragSrcIdx;

                    const arr = [...state.selectedOrder];
                    const [item] = arr.splice(fromIdx, 1);
                    // recalc target after removal
                    let insertIdx = e.clientY < midY ? idx : idx + 1;

        const renderSidebarRight = () => {

            const prompt = items.map(a => {

                return state.promptFormat === 'webui' ? (w===1 ? a.tag : `(${a.tag}:${w.toFixed(1)})`) : (w===1 ? a.tag : `${w.toFixed(1)}:: ${a.tag} ::`);

            container.innerHTML = `
                <div class="p-5 border-b border-slate-200/50 dark:border-slate-700/50 flex justify-between items-center"><h2 class="dark:text-white flex items-center gap-2"><i data-lucide="wand-2" class="w-4 h-4"></i> Prompt 编排</h2><div class="flex items-center gap-2"><span class="bg-indigo-100 text-indigo-600 text-xs font-semibold px-2 py-1 rounded-full">${items.length}</span><button onclick="closeToolPanels()" class="panel-close" aria-label="关闭 Prompt 编排"><i data-lucide="x" class="w-4 h-4"></i></button></div></div>

                <div class="px-5 py-3 bg-slate-50 dark:bg-slate-800/30 border-b border-slate-200/50 dark:border-slate-700/50 flex items-center justify-between"><span class="text-xs font-medium text-slate-500">输出格式</span><div class="format-switch flex bg-slate-200 dark:bg-slate-700 p-1 w-32 relative cursor-pointer" role="button" tabindex="0" aria-label="切换 Prompt 格式" onclick="state.promptFormat=state.promptFormat==='webui'?'novelai':'webui';renderSidebarRight()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}"><div class="absolute inset-y-1 w-[calc(50%-4px)] bg-white dark:bg-indigo-500 shadow-sm capsule-bg" style="left: ${isWebui?'4px':'calc(50%)'}"></div><div class="flex-1 text-[10px] font-semibold text-center z-10 py-1 ${isWebui?'format-active':'format-inactive'}">SDXL</div><div class="flex-1 text-[10px] font-semibold text-center z-10 py-1 ${!isWebui?'format-active':'format-inactive'}">NAI</div></div></div>
                <div class="flex-1 overflow-y-auto p-5 space-y-2 custom-scrollbar" id="right-artist-list-scroll">${items.length === 0 ? `<div class="text-center text-slate-400 py-10"><i data-lucide="clipboard-paste" class="w-10 h-10 mx-auto mb-3 opacity-30"></i><p>点击左侧卡片选择画师</p><p class="text-xs mt-1 opacity-60">或在下方文本框粘贴画师串导入</p></div>` : items.map((a, idx) => { const id = String(a.id); const w = state.selected[id]; const pct = totalWeight > 0 ? ((w/totalWeight)*100).toFixed(1) : '0'; const color = PIE_COLORS[idx % PIE_COLORS.length]; const isFirst = idx === 0; const isLast = idx === items.length - 1; const isGhost = !!a._ghost; return `<div class="flex items-center gap-1 group bg-white/50 dark:bg-slate-800/50 p-2 rounded-xl border border-transparent hover:border-slate-200 dark:hover:border-slate-700 transition-all artist-hover-row artist-drag-item ${isGhost ? 'ghost-artist' : ''}" data-artist-id="${id}" data-artist-idx="${idx}" draggable="true"><div class="flex flex-col gap-0.5 flex-shrink-0 mr-1"><button onclick="event.stopPropagation();moveSelectedArtist(${idx},${idx-1})" class="artist-move-btn" ${isFirst?'disabled':''}><i data-lucide="chevron-up" class="w-3 h-3"></i></button><button onclick="event.stopPropagation();moveSelectedArtist(${idx},${idx+1})" class="artist-move-btn" ${isLast?'disabled':''}><i data-lucide="chevron-down" class="w-3 h-3"></i></button></div><div class="flex items-center flex-1 min-w-0 cursor-default" ${!isGhost ? `onmouseenter="showArtistPreview('${id}',event)" onmousemove="movePreviewTooltip(event)" onmouseleave="hideArtistPreview()"` : ''}><div class="w-3 h-3 rounded-full flex-shrink-0 mr-2" style="background:${isGhost ? '#94a3b8' : color};box-shadow:0 0 6px ${isGhost ? '#94a3b860' : color+'60'}"></div><div class="flex-1 min-w-0 pr-2"><div class="text-sm font-bold text-slate-700 dark:text-slate-200 truncate">${a.name}${isGhost ? '<span class="ghost-badge"><i data-lucide="help-circle" class="w-3 h-3"></i>未匹配</span>' : ''}</div><div class="text-xs text-slate-400 truncate font-mono mt-0.5">${a.tag} <span style="color:${isGhost ? '#94a3b8' : color};font-weight:700">${pct}%</span></div></div></div><div class="flex items-center gap-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-1 shadow-sm"><button onclick="state.selected['${id}']=(state.selected['${id}']-0.1)||0.1;renderSidebarRight()" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded text-slate-500 hover:text-indigo-600"><i data-lucide="minus" class="w-3.5 h-3.5"></i></button><span class="text-xs font-mono w-8 text-center font-bold dark:text-white">${w.toFixed(1)}</span><button onclick="state.selected['${id}']=(state.selected['${id}']+0.1)||0.1;renderSidebarRight()" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded text-slate-500 hover:text-indigo-600"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button></div><button onclick="delete state.selected['${id}'];state.selectedOrder=state.selectedOrder.filter(x=>x!=='${id}');if('${id}'.startsWith('_ghost_')){state.artists=state.artists.filter(a=>String(a.id)!=='${id}');}hideArtistPreview();updateCardVisual('${id}');renderSidebarRight()" class="ml-1 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-lg p-1 transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button></div>`}).join('')}</div>
                <div class="p-5 border-t border-slate-200/50 dark:border-slate-700/50 space-y-3 bg-white/60 dark:bg-slate-900/60 backdrop-blur-md"><textarea id="res-box" class="w-full h-24 text-sm p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none dark:text-slate-300 shadow-inner" placeholder="粘贴画师串到此处导入，或由选择自动生成...">${prompt}</textarea><div class="flex gap-2"><button onclick="const box=document.getElementById('res-box');importFromPromptText(box.value)" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold shadow-lg shadow-amber-500/30 flex items-center justify-center gap-1 import-prompt-btn"><i data-lucide="clipboard-paste" class="w-4 h-4"></i> 导入串</button><button onclick="actions.openAddPresetModal()" class="flex-1 py-2.5 bg-green-500 hover:bg-green-600 text-white rounded-xl text-xs font-bold shadow-lg shadow-green-500/30 flex items-center justify-center gap-1"><i data-lucide="save" class="w-4 h-4"></i> 存预设</button><button onclick="document.getElementById('res-box').select();document.execCommand('copy');showToast('咒语已复制')" class="flex-[2] bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-lg shadow-indigo-500/30 flex items-center justify-center gap-2 active:scale-95 transition-transform"><i data-lucide="copy" class="w-4 h-4"></i> 复制</button><button onclick="state.selected={};state.selectedOrder=[];state.artists=state.artists.filter(a=>!a._ghost);renderGrid();renderSidebarRight()" class="p-3 rounded-xl border border-red-200 text-red-500 hover:bg-red-50 hover:border-red-300 transition-colors"><i data-lucide="trash-2" class="w-5 h-5"></i></button></div></div>`;
            // Restore scroll position of the artist list after re-render

        const renderModal = () => {
            const container = document.getElementById('modal-container');
            if (state.dbUpdateRunning) return;

            const batchScroll = document.getElementById('modal-batch-cat-scroll');

            const savedEditPresetScroll = editPresetScroll ? editPresetScroll.scrollTop : 0;
