            if(state.modal === 'batch-cat') {
                const div = document.createElement('div');
                div.innerHTML = `<div class="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"><div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="state.modal=null;renderModal()"></div><div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-3xl p-6 relative z-10 shadow-2xl"><h2 class="text-xl font-bold mb-4 dark:text-white">批量添加到分类</h2><div id="modal-batch-cat-scroll" class="max-h-60 overflow-y-auto space-y-2 mb-6 custom-scrollbar">${state.categories.map(c => `<label class="flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer border border-slate-100 dark:border-slate-700"><input type="checkbox" value="${c}" class="w-5 h-5 accent-indigo-600 batch-cat-check"><span class="text-sm font-bold text-slate-700 dark:text-slate-300">${c}</span></label>`).join('')}</div><div class="flex gap-3"><button onclick="state.modal=null;renderModal()" class="flex-1 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-100">取消</button><button onclick="const checks=[...document.querySelectorAll('.batch-cat-check:checked')].map(e=>e.value);actions.batchAddCategories(checks)" class="flex-1 py-3 rounded-xl font-bold bg-indigo-600 text-white shadow-lg">确定</button></div></div></div>`;
                container.appendChild(div);
                return;
            }

            if(state.modal === 'add-preset') {
                const div = document.createElement('div');
                const { name, imageUrl } = state.formData;
                div.innerHTML = `<div class="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"><div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="state.modal=null;renderModal()"></div><div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl p-6 relative z-10 shadow-2xl"><h2 class="text-xl font-bold mb-4 dark:text-white">保存风格预设</h2><div class="space-y-4"><div><label class="text-xs font-bold text-slate-500 uppercase">预设名称</label><input type="text" value="${name}" oninput="state.formData.name=this.value" class="w-full mt-1 p-3 rounded-xl bg-slate-100 dark:bg-slate-800 border-none"></div><div><label class="text-xs font-bold text-slate-500 uppercase">封面图 (可选)</label><div onclick="document.getElementById('p-file').click()" class="mt-1 h-32 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl flex items-center justify-center cursor-pointer overflow-hidden relative">${imageUrl?`<img src="${imageUrl}" class="w-full h-full object-cover">`:`<span class="text-slate-400 text-xs">点击上传</span>`}<input type="file" id="p-file" class="hidden" accept="image/*" onchange="compressImage(this.files[0]).then(b=>{state.formData.imageUrl=b;renderModal()})"></div></div></div><div class="mt-6 flex gap-3"><button onclick="state.modal=null;renderModal()" class="flex-1 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-100">取消</button><button onclick="actions.saveNewPreset()" class="flex-1 py-3 rounded-xl font-bold bg-green-500 text-white shadow-lg">保存</button></div></div></div>`;
                container.appendChild(div);
                return;
            }

            if(state.modal === 'edit-preset') {
                const div = document.createElement('div');
                const { name, imageUrl, items } = state.formData;
                div.innerHTML = `<div class="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"><div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="state.modal=null;renderModal()"></div><div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl p-6 relative z-10 shadow-2xl"><h2 class="text-xl font-bold mb-4 dark:text-white">编辑预设</h2><div class="space-y-4"><div><label class="text-xs font-bold text-slate-500 uppercase">名称</label><input type="text" value="${name}" oninput="state.formData.name=this.value" class="w-full mt-1 p-3 rounded-xl bg-slate-100 dark:bg-slate-800 border-none"></div><div><label class="text-xs font-bold text-slate-500 uppercase">封面</label><div onclick="document.getElementById('pe-file').click()" class="mt-1 h-32 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl flex items-center justify-center cursor-pointer overflow-hidden relative">${imageUrl?`<img src="${imageUrl}" class="w-full h-full object-cover">`:`<span class="text-slate-400 text-xs">点击上传</span>`}<input type="file" id="pe-file" class="hidden" accept="image/*" onchange="compressImage(this.files[0]).then(b=>{state.formData.imageUrl=b;renderModal()})"></div></div><div><label class="text-xs font-bold text-slate-500 uppercase">包含画师 (${items.length})</label><div id="modal-edit-preset-scroll" class="max-h-32 overflow-y-auto bg-slate-50 dark:bg-slate-800 rounded-xl p-2 mt-1 custom-scrollbar">${items.map(i => {const a=state.artists.find(x=>String(x.id)===i.id);return `<div class="text-xs py-1 px-2 border-b border-slate-200 dark:border-slate-700 last:border-0 flex justify-between"><span>${a?a.name:'Unknown'}</span><span class="font-mono text-slate-400">${i.weight}</span></div>`}).join('')}</div></div></div><div class="mt-6 flex gap-3"><button onclick="actions.deletePreset('${state.editingId}')" class="px-4 py-3 rounded-xl font-bold text-red-500 hover:bg-red-50 border border-red-100">删除</button><div class="flex-1"></div><button onclick="state.modal=null;renderModal()" class="px-5 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-100">取消</button><button onclick="actions.updatePreset()" class="px-5 py-3 rounded-xl font-bold bg-indigo-600 text-white shadow-lg">更新</button></div></div></div>`;
                container.appendChild(div);
                const newEditPresetScroll = document.getElementById('modal-edit-preset-scroll');
                if (newEditPresetScroll) { newEditPresetScroll.offsetHeight; newEditPresetScroll.scrollTop = savedEditPresetScroll; }
                return;
            }

            if(state.modal === 'danbooru-update') {
                const div = document.createElement('div');
                const mode = (state.formData && state.formData.dbMode) || 'incremental';
                const noCount = state.artists.filter(a => !(a.danbooruCount > 0)).length;
                const noUrls = state.artists.filter(a => (a.danbooruCount > 0) && (!a.socialLinks || !a.socialLinks.length)).length;
                div.innerHTML = `<div class="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"><div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="if(!danbooruFetcher.isRunning()){state.modal=null;renderModal()}"></div><div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-3xl p-6 relative z-10 shadow-2xl max-h-[85vh] overflow-y-auto custom-scrollbar"><h2 class="text-xl font-bold mb-4 dark:text-white flex items-center gap-2"><i data-lucide="zap" class="w-5 h-5 text-amber-500"></i> Danbooru \u6570\u636e\u66f4\u65b0</h2><div class="mb-4 p-3 rounded-xl bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700/30 text-xs text-amber-700 dark:text-amber-300 flex items-start gap-2"><i data-lucide="shield-alert" class="w-4 h-4 mt-0.5 flex-shrink-0"></i><span>\u4f7f\u7528\u6b64\u529f\u80fd\u9700\u8981<b>\u5f00\u542f VPN</b> \u8bbf\u95ee Danbooru API\uff0c\u5426\u5219\u65e0\u6cd5\u6b63\u5e38\u8fd0\u884c\u3002\u8bf7\u786e\u4fdd\u53ef\u8fde\u63a5 danbooru.donmai.us</span></div><div id="db-config" class="space-y-4"><div><label class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 block">\u66f4\u65b0\u6a21\u5f0f</label><div class="flex gap-2"><button class="db-mode-btn ${mode==='incremental'?'active':''}" data-mode="incremental" onclick="dbSetMode('incremental')"\u003e\u4ec5\u672a\u66f4\u65b0</button><button class="db-mode-btn ${mode==='force'?'active':''}" data-mode="force" onclick="dbSetMode('force')">\u5168\u90e8\u66f4\u65b0</button><button class="db-mode-btn ${mode==='urls_only'?'active':''}" data-mode="urls_only" onclick="dbSetMode('urls_only')">\u4ec5\u8865\u94fe\u63a5</button></div></div><label class="flex items-center gap-2 cursor-pointer group"><input type="checkbox" id="db-skip-urls" class="w-4 h-4 accent-indigo-600 rounded"><span class="text-sm text-slate-600 dark:text-slate-400 group-hover:text-slate-900 dark:group-hover:text-white transition-colors">\u4e0d\u6293\u53d6\u793e\u4ea4\u94fe\u63a5 (\u4ec5\u66f4\u65b0\u70ed\u5ea6)</span></label><div><label class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">\u901f\u7387: <span id="db-rate-display" class="text-indigo-600 dark:text-indigo-400">3</span> \u8bf7\u6c42/\u79d2</label><input type="range" id="db-rate" min="1" max="6" value="3" oninput="document.getElementById('db-rate-display').textContent=this.value" class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-600"><div class="flex justify-between text-[10px] text-slate-400 mt-1"><span>\u6162 (\u7a33\u5b9a)</span><span>\u5feb (\u53ef\u80fd\u89e6\u53d1\u9650\u6d41)</span></div></div><div class="pt-3 border-t border-slate-100 dark:border-slate-800 text-xs text-slate-400 dark:text-slate-500 flex gap-3 flex-wrap"><span>\u5171 ${state.artists.length} \u4f4d\u753b\u5e08</span><span>\u672a\u66f4\u65b0\u70ed\u5ea6: <b class="text-orange-500">${noCount}</b></span><span>\u7f3a\u793e\u4ea4\u94fe\u63a5: <b class="text-blue-500">${noUrls}</b></span></div><button onclick="dbStartUpdate()" class="w-full py-3 rounded-xl font-bold bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-lg shadow-orange-500/25 hover:shadow-orange-500/40 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm mt-4"><i data-lucide="rocket" class="w-4 h-4"></i> \u5f00\u59cb\u66f4\u65b0</button></div><div id="db-progress" style="display:none" class="space-y-4"><div class="db-progress-bar"><div id="db-progress-fill" class="db-progress-fill" style="width:0%"></div></div><div id="db-progress-text" class="text-center text-sm font-bold text-slate-600 dark:text-slate-300">0% (0/0)</div><div class="flex gap-2 mt-2"><div class="db-stat-card bg-green-50 dark:bg-green-900/20"><span id="db-stat-ok" class="db-stat-value text-green-500">0</span><span class="db-stat-label">\u5339\u914d</span></div><div class="db-stat-card bg-slate-50 dark:bg-slate-800/50"><span id="db-stat-miss" class="db-stat-value text-slate-400">0</span><span class="db-stat-label">\u672a\u627e\u5230</span></div><div class="db-stat-card bg-red-50 dark:bg-red-900/20"><span id="db-stat-err" class="db-stat-value text-red-400">0</span><span class="db-stat-label">\u9519\u8bef</span></div><div class="db-stat-card bg-indigo-50 dark:bg-indigo-900/20"><span id="db-stat-speed" class="db-stat-value text-indigo-500">0</span><span class="db-stat-label">\u901f\u5ea6/s</span></div></div><div class="flex justify-between text-xs text-slate-500 dark:text-slate-400 mt-1"><span id="db-eta">\u23f1 ETA: --</span><span id="db-current" class="truncate ml-4 text-right db-pulse max-w-[180px]"></span></div></div><div id="db-logs" class="db-log-area mt-4" style="display:none"></div><div class="mt-5 flex gap-3"><button id="db-cancel-btn" onclick="danbooruFetcher.cancel()" style="display:none" class="flex-1 py-3 rounded-xl font-bold text-red-500 border border-red-200 dark:border-red-900/30 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">\u53d6\u6d88\u66f4\u65b0</button><button id="db-close-btn" onclick="state.modal=null;renderModal();renderAll()" class="flex-1 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">\u5173\u95ed</button></div></div></div>`;
                container.appendChild(div);
                lucide.createIcons(div);
                return;
            }

            if(state.modal === 'add') {
                const { name, tag, categories, imageUrl, danbooruCount, socialLinks } = state.formData;
                const isEdit = !!state.editingId;
                const socialLinksText = (socialLinks || []).join('\n');
                const div = document.createElement('div');
                div.innerHTML = `<div class="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"><div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="state.modal=null;renderModal()"></div><div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-3xl p-6 relative z-10 shadow-2xl overflow-hidden transform transition-all max-h-[90vh] overflow-y-auto custom-scrollbar"><h2 class="text-xl font-bold mb-5 dark:text-white">${isEdit?'编辑画师':'添加画师'}</h2><div class="space-y-4"><div class="flex gap-4"><div class="flex-1"><label class="text-xs font-bold text-slate-500 uppercase tracking-wider">名称</label><input type="text" value="${name||''}" oninput="state.formData.name=this.value" class="w-full mt-1 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border-none text-sm dark:text-white focus:ring-2 focus:ring-indigo-500 transition-shadow"></div><div class="flex-1"><label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Tag <span class="text-red-500">*</span></label><input type="text" value="${tag||''}" oninput="state.formData.tag=this.value" class="w-full mt-1 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border-none text-sm font-mono dark:text-white focus:ring-2 focus:ring-indigo-500 transition-shadow"></div></div><div><label class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 block">所属分类 (多选)</label><div id="modal-add-cat-scroll" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar p-1">${state.categories.map(c => {const isActive = categories.includes(c);return `<button onclick="const arr=state.formData.categories; if(arr.includes('${c}')) state.formData.categories=arr.filter(x=>x!=='${c}'); else state.formData.categories.push('${c}'); renderModal();" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition-all ${isActive ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 border-transparent hover:bg-slate-200'}">${c}</button>`;}).join('')}</div></div><div class="flex gap-4"><div class="flex-1"><label class="text-xs font-bold text-slate-500 uppercase tracking-wider">热度</label><input type="number" value="${danbooruCount||0}" oninput="state.formData.danbooruCount=this.value" class="w-full mt-1 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border-none text-sm dark:text-white focus:ring-2 focus:ring-indigo-500 transition-shadow"></div><div class="flex-[2]"><label class="text-xs font-bold text-slate-500 uppercase tracking-wider">封面</label><div onclick="document.getElementById('modal-file').click()" class="mt-1 h-12 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl flex items-center justify-center cursor-pointer relative overflow-hidden group hover:border-indigo-500 transition-colors">${imageUrl ? `<span class="text-xs text-green-500 font-bold">已选择图片 (点击更换)</span>` : `<span class="text-xs text-slate-400">点击上传封面</span>`}<input type="file" id="modal-file" class="hidden" accept="image/*" onchange="compressImage(this.files[0]).then(b64 => {state.formData.imageUrl=b64;renderModal()})"></div></div></div><div><label class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-2">社交链接 <span class="text-[10px] text-slate-400 font-normal normal-case">每行一个 URL</span></label><textarea id="social-links-input" class="w-full mt-1 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border-none text-xs font-mono dark:text-white focus:ring-2 focus:ring-indigo-500 transition-shadow resize-none" rows="3" placeholder="https://twitter.com/...&#10;https://www.pixiv.net/users/...&#10;https://example.com/" oninput="state.formData.socialLinks=this.value.split('\n').map(s=>s.trim()).filter(Boolean)">${socialLinksText}</textarea>${socialLinks && socialLinks.length > 0 ? `<div class="flex gap-1 mt-1.5 flex-wrap">${socialLinks.map(u => `<a href="${u}" target="_blank" rel="noopener" class="social-link-icon" title="${u}">${getSocialIcon(u)}</a>`).join('')}</div>` : ''}</div></div><div class="mt-8 flex gap-3"><button onclick="state.modal=null;renderModal()" class="flex-1 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">取消</button><button onclick="actions.saveArtist()" class="flex-1 py-3 rounded-xl font-bold bg-indigo-600 text-white shadow-lg shadow-indigo-500/30 hover:bg-indigo-700 transition-colors">保存</button></div></div></div>`;
                container.appendChild(div);
                const newAddCatScroll = document.getElementById('modal-add-cat-scroll');
                if (newAddCatScroll) { newAddCatScroll.offsetHeight; newAddCatScroll.scrollTop = savedAddCatScroll; }
            }
        };

        const showToast = (msg) => {
            const div = document.createElement('div');
            div.className = 'bg-slate-800 text-white px-5 py-3 rounded-full shadow-xl text-sm font-bold flex items-center gap-2 animate-fade-in z-[200]';
            div.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5 text-green-400"></i> ${msg}`;
            document.getElementById('toast-container').appendChild(div);
            lucide.createIcons(div);
            setTimeout(() => div.remove(), 2000);
        };

        const isOriginButtonEligible = (button) => {
            if (!(button instanceof HTMLButtonElement)) return false;
            if (button.classList.contains('panel-scrim')) return false;
            if (button.classList.contains('artist-move-btn')) return false;
            if (button.classList.contains('db-mode-btn')) return false;
            if (button.closest('.view-switch')) return false;
            if (button.closest('.category-item')) return false;
            return true;
        };

        const ensureOriginButtonLabel = (button) => {
            if (button.hasAttribute('aria-label') || button.textContent.trim()) return;

            const icon = button.querySelector('i');
            let label = '';
            if (button.matches('#res-box + div button:last-child')) label = '清空 Prompt';
            else if (button.closest('#pagination-container') && icon?.classList.contains('ph-caret-left')) label = '上一页';
            else if (button.closest('#pagination-container') && icon?.classList.contains('ph-caret-right')) label = '下一页';
            else if (button.closest('.artist-drag-item') && icon?.classList.contains('ph-minus')) label = '降低权重';
            else if (button.closest('.artist-drag-item') && icon?.classList.contains('ph-plus')) label = '提高权重';
            else if (button.closest('.artist-drag-item') && icon?.classList.contains('ph-x')) label = '移除画师';
            else if (button.closest('.glass-card') && icon?.classList.contains('ph-pencil-simple')) label = '编辑';
            else if (button.closest('.glass-card') && icon?.classList.contains('ph-trash')) label = '删除';

            if (!label) return;
            button.setAttribute('aria-label', label);
            button.title = label;
        };

        const prepareOriginButton = (button) => {
            if (!isOriginButtonEligible(button) || button.dataset.originButton === 'ready') return button;

            ensureOriginButtonLabel(button);
            button.dataset.originButton = 'ready';
            button.classList.add('origin-button');

            const content = document.createElement('span');
            content.className = 'origin-button__content';
            while (button.firstChild) content.appendChild(button.firstChild);
            button.appendChild(content);
            return button;
        };

        const getOriginButtonFromEvent = (event) => {
            if (!(event.target instanceof Element)) return null;
            const button = event.target.closest('button');
            return isOriginButtonEligible(button) ? prepareOriginButton(button) : null;
        };

        const setOriginButtonPoint = (button, clientX, clientY) => {
            const bounds = button.getBoundingClientRect();
            const x = clientX == null ? bounds.width / 2 : Math.max(0, Math.min(bounds.width, clientX - bounds.left));
            const y = clientY == null ? bounds.height / 2 : Math.max(0, Math.min(bounds.height, clientY - bounds.top));
            const radius = Math.max(
                Math.hypot(x, y),
                Math.hypot(bounds.width - x, y),
                Math.hypot(x, bounds.height - y),
                Math.hypot(bounds.width - x, bounds.height - y)
            );

            button.style.setProperty('--origin-x', `${x.toFixed(2)}px`);
            button.style.setProperty('--origin-y', `${y.toFixed(2)}px`);
            button.style.setProperty('--origin-size', `${Math.ceil(radius * 2)}px`);
        };

        const showOriginButtonFill = (button, clientX = null, clientY = null) => {
            if (!button || button.disabled) return;
            setOriginButtonPoint(button, clientX, clientY);
            button.classList.add('is-origin-active');
        };

        const hideOriginButtonFill = (button) => {
            if (!button) return;
            button.classList.remove('is-origin-active');
            button.dataset.originPressed = 'false';
        };

        const initOriginButtons = () => {
            document.querySelectorAll('button').forEach(prepareOriginButton);

            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => mutation.addedNodes.forEach((node) => {
                    if (!(node instanceof Element)) return;
                    if (node.matches('button')) prepareOriginButton(node);
                    node.querySelectorAll('button').forEach(prepareOriginButton);
                }));
            });
            observer.observe(document.body, { childList: true, subtree: true });

            document.addEventListener('pointerover', (event) => {
                const button = getOriginButtonFromEvent(event);
                if (!button || (event.relatedTarget instanceof Node && button.contains(event.relatedTarget))) return;
                showOriginButtonFill(button, event.clientX, event.clientY);
            });
            document.addEventListener('pointerout', (event) => {
                const button = getOriginButtonFromEvent(event);
                if (!button || (event.relatedTarget instanceof Node && button.contains(event.relatedTarget))) return;
                hideOriginButtonFill(button);
            });
            document.addEventListener('pointerdown', (event) => {
                const button = getOriginButtonFromEvent(event);
                if (!button || event.button !== 0) return;
                showOriginButtonFill(button, event.clientX, event.clientY);
                button.dataset.originPressed = 'true';
            });
            document.addEventListener('pointerup', (event) => {
                const button = getOriginButtonFromEvent(event);
                if (!button) return;
                button.dataset.originPressed = 'false';
                if (!button.matches(':hover, :focus-visible')) hideOriginButtonFill(button);
            });
            document.addEventListener('pointercancel', (event) => hideOriginButtonFill(getOriginButtonFromEvent(event)));
            document.addEventListener('focusin', (event) => {
                const button = getOriginButtonFromEvent(event);
                if (button?.matches(':focus-visible')) showOriginButtonFill(button);
            });
            document.addEventListener('focusout', (event) => hideOriginButtonFill(getOriginButtonFromEvent(event)));
            document.addEventListener('keydown', (event) => {
                if (event.key !== 'Enter' && event.key !== ' ') return;
                const button = getOriginButtonFromEvent(event);
                if (!button || event.repeat) return;
                showOriginButtonFill(button);
                button.dataset.originPressed = 'true';
            });
            document.addEventListener('keyup', (event) => {
                if (event.key !== 'Enter' && event.key !== ' ') return;
                const button = getOriginButtonFromEvent(event);
                if (!button) return;
                button.dataset.originPressed = 'false';
                if (!button.matches(':hover, :focus-visible')) hideOriginButtonFill(button);
            });
        };

        actions.init();
        initOriginButtons();

    </script>
</body>
</html>
